<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGT Quest — Kuiz Kejururawatan</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eaf4fa;background:#091824;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#15444b,transparent 65%)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f8cc66;outline-offset:4px}.shell{max-width:850px;margin:auto;padding:30px 22px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:38px}.brand{font-weight:800;letter-spacing:2px}.tag,.eyebrow{color:#76dec9;font-size:12px;letter-spacing:2px;font-weight:700}.tag{border:1px solid #346166;border-radius:20px;padding:8px 12px}.card{background:#102635;border:1px solid #2b4656;border-radius:24px;padding:32px;box-shadow:0 20px 80px #0003}h1{font-size:clamp(32px,6vw,50px);line-height:1.1;letter-spacing:-2px;margin:16px 0}h2{font-size:clamp(22px,4vw,29px);line-height:1.35;margin:25px 0}p{color:#b9cdd9;line-height:1.65}.pill-row{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}.pill{background:#193746;padding:10px 14px;border-radius:12px;color:#cde1ec}.primary{border:0;background:#76dec9;color:#092c31;font-weight:800;padding:15px 24px;border-radius:12px}.secondary{border:1px solid #466372;background:transparent;color:#eaf4fa;padding:14px 22px;border-radius:12px}.topline{display:flex;justify-content:space-between;color:#b9cdd9;gap:10px}.track{height:7px;background:#294250;border-radius:10px;margin-top:16px;overflow:hidden}.bar{height:100%;background:#76dec9;transition:width .3s}.answers{display:grid;gap:12px}.answer{display:flex;gap:15px;align-items:center;text-align:left;width:100%;border:1px solid #385565;border-radius:14px;background:#142f40;color:#eaf4fa;padding:16px;line-height:1.45}.answer:hover:not(:disabled){border-color:#76dec9;background:#1a3d4b}.letter{display:grid;place-items:center;min-width:33px;height:33px;border-radius:9px;background:#264858;font-weight:700}.answer:disabled{cursor:default;opacity:1}.answer.correct{border-color:#76dec9;background:#16463e}.answer.wrong{border-color:#f89b9b;background:#4b2e39}.feedback{margin-top:20px;padding:18px;border-radius:14px;background:#193847;line-height:1.6}.feedback strong{display:block;margin-bottom:4px}.actions{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.score{font-size:72px;font-weight:850;color:#76dec9;letter-spacing:-4px;margin:20px 0 0}.review{border-top:1px solid #2b4656;padding:17px 0}.review p{margin:5px 0;font-size:14px}.review strong{font-size:15px}footer{color:#91abb9;font-size:12px;margin-top:24px;text-align:center;line-height:1.6}[hidden]{display:none!important}@media(max-width:520px){.shell{padding:20px 14px}.card{padding:23px 19px}header{margin-bottom:25px}.tag{font-size:10px}.answer{padding:12px}.primary{width:100%}}
</style></head>
<body><div class="shell"><header><div class="brand">NGT <span style="color:#76dec9">QUEST</span></div><div class="tag">NURSING CLASSROOM</div></header><main id="app"></main><footer>Berdasarkan nota pengajaran Nasogastric Tube Insertion.<br>Aktiviti pembelajaran untuk pelajar kejururawatan.</footer></div>
<script>
const questions=[
{q:'Di manakah hujung nasogastric tube sepatutnya berada?',a:['Trachea','Oesophagus','Stomach','Lungs'],c:2,why:'Hujung nasogastric tube sepatutnya berada di dalam stomach.'},
{q:'Apakah tujuan decompression menggunakan nasogastric tube?',a:['Mengeluarkan gas dan gastric contents','Membekalkan oxygen ke lungs','Mengeluarkan air kencing','Menyalurkan cecair ke vein'],c:0,why:'Decompression mengeluarkan gas dan gastric contents untuk mengurangkan distension.'},
{q:'Yang manakah merupakan contraindication utama nasogastric tube insertion?',a:['Dysphagia akibat stroke','Basal skull fracture','Intestinal obstruction','Paralytic ileus'],c:1,why:'Basal skull fracture meningkatkan risiko tiub tersasar ke dalam cranial cavity.'},
{q:'Apakah jenis lubricant yang digunakan untuk nasogastric tube insertion?',a:['Mineral oil','Petroleum jelly','Minyak masak','Water-soluble gel'],c:3,why:'Water-soluble gel mengurangkan geseran semasa insertion.'},
{q:'Bagaimanakah panjang nasogastric tube diukur sebelum insertion?',a:['Dari tip of the nose ke earlobe, kemudian ke xiphoid process of the sternum.','Dari tip of the nose ke earlobe, kemudian ke umbilicus.','Dari tip of the nose ke chin, kemudian ke xiphoid process of the sternum.','Dari tip of the nose ke chin, kemudian ke umbilicus.'],c:0,why:'Mengikut nota, ukur dari tip of the nose ke earlobe, kemudian ke xiphoid process of the sternum. Ukuran ini menganggarkan panjang tiub; kedudukan tiub masih perlu disahkan sebelum digunakan.'}
];
let index=0,score=0,selected=[],locked=false;
const app=document.getElementById('app');
function intro(){app.innerHTML=`<section class="card"><div class="eyebrow">MISI PEMBELAJARAN</div><h1>Sejauh mana anda<br>kenal NGT?</h1><p>Uji pengetahuan anda tentang <strong>Nasogastric Tube Insertion</strong>. Pilih satu jawapan bagi setiap soalan dan pelajari penjelasannya.</p><div class="pill-row"><span class="pill">5 soalan</span><span class="pill">20 mata setiap jawapan betul</span><span class="pill">Tanpa had masa</span></div><button class="primary" id="start">Mula permainan →</button></section>`;document.getElementById('start').onclick=start;}
function start(){index=0;score=0;selected=[];showQuestion();}
function showQuestion(){locked=false;const q=questions[index];app.innerHTML=`<section class="card"><div class="topline"><span>Soalan ${index+1} / ${questions.length}</span><strong>${score} mata</strong></div><div class="track" role="progressbar" aria-label="Kemajuan kuiz" aria-valuenow="${index}" aria-valuemin="0" aria-valuemax="5"><div class="bar" style="width:${index/5*100}%"></div></div><h2 tabindex="-1">${q.q}</h2><div class="answers">${q.a.map((a,i)=>`<button class="answer" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${a}</span></button>`).join('')}</div><div id="feedback" class="feedback" role="status" hidden></div><div class="actions"><button class="primary" id="next" hidden>${index===4?'Lihat keputusan':'Soalan seterusnya →'}</button></div></section>`;app.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));document.getElementById('next').onclick=()=>{index++;index<5?showQuestion():finish()};app.querySelector('h2').focus();}
function answer(i){if(locked)return;locked=true;const q=questions[index],correct=i===q.c;selected.push(i);if(correct)score+=20;app.querySelector('.topline strong').textContent=score+' mata';app.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=document.getElementById('feedback');f.hidden=false;f.innerHTML=`<strong>${correct?'✓ Betul! +20 mata':'✕ Belum tepat. Jawapan: '+ 'ABCD'[q.c]}</strong>${q.why}`;document.getElementById('next').hidden=false;document.getElementById('next').focus();}
function finish(){app.innerHTML=`<section class="card"><div class="eyebrow">MISI SELESAI</div><h1 tabindex="-1">${score===100?'Cemerlang!':score>=60?'Usaha yang baik!':'Teruskan belajar!'}</h1><div class="score">${score}<span style="font-size:24px;color:#adc3d0;letter-spacing:0"> / 100</span></div><p>${score/20} daripada 5 jawapan betul. ${score===100?'Anda berjaya menjawab semua soalan dengan tepat.':'Semak jawapan di bawah dan cuba sekali lagi.'}</p><div class="actions"><button class="primary" id="restart">Main semula ↻</button><button class="secondary" id="reviewBtn" aria-expanded="false">Semak jawapan</button></div><div id="review" hidden style="margin-top:25px">${questions.map((q,i)=>`<div class="review"><strong>${selected[i]===q.c?'✓':'✕'} ${i+1}. ${q.q}</strong><p>Jawapan anda: ${'ABCD'[selected[i]]}. ${q.a[selected[i]]}</p><p><strong>Jawapan betul: ${'ABCD'[q.c]}. ${q.a[q.c]}</strong></p><p>${q.why}</p></div>`).join('')}</div></section>`;document.getElementById('restart').onclick=start;document.getElementById('reviewBtn').onclick=function(){const r=document.getElementById('review');r.hidden=!r.hidden;this.setAttribute('aria-expanded',String(!r.hidden));this.textContent=r.hidden?'Semak jawapan':'Tutup semakan'};app.querySelector('h1').focus();}
intro();
</script></body></html>
